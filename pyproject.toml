[tool.ruff]
line-length = 100
extend-exclude = ["data"]

[tool.ruff.lint]
# 只启用基础且低噪音的规则；宽泛异常捕获在本项目是有意为之
select = ["E", "F", "W", "I"]
ignore = ["E501", "E402"]

[tool.ruff.format]
quote-style = "double"

# basedpyright 配置：默认太严格，关掉对动态代码噪音最大的几类检查
[tool.basedpyright]
typeCheckingMode = "basic"
reportMissingTypeArgument = "none"
reportUnknownMemberType = "none"
reportUnknownArgumentType = "none"
reportUnknownVariableType = "none"
reportUnknownParameterType = "none"
reportUnusedCallResult = "none"
reportConstantRedefinition = "none"
reportPossiblyUnboundVariable = "warning"   # PIL 可选导入导致，保留提醒即可
